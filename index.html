<!DOCTYPE html>
<html lang="en" data-theme="dark" data-pal="violet" data-motion="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clerkship · Wise Choice</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body data-view="home">

<!-- shared SVG gradients (flame + score rings) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient>
  <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d1a"/><stop offset=".55" stop-color="#ffa51f"/><stop offset="1" stop-color="#ffe27a"/></linearGradient>
</defs></svg>

<div class="mesh"><i></i><i></i><i></i><i></i></div>

<header class="top">
  <button class="brand" data-act="nav" data-v="home" aria-label="Home">
    <img class="mk" src="logo.png" alt="Wise Choice logo" width="42" height="42">
    <span><b>Wise Choice</b><small>Your Shortcut through the Syllabus!</small></span>
  </button>
  <div class="hright">
    <button class="chip cdchip" id="hCd" data-act="nav" data-v="plan"></button>
    <button class="sw" id="tgl" data-act="theme" aria-label="Dark / light mode"><i></i></button>
  </div>
</header>

<div class="shell" id="shell">
  <aside id="profile"></aside>
  <main id="app"></main>
</div>

<!-- floating navigation dock -->
<nav id="dock" aria-label="Main navigation"></nav>

<!-- floating Wise Drill button -->
<button class="fabx" id="fabDrill" data-act="drill" aria-label="Start Wise Drill">
  <svg class="flame" viewBox="0 0 64 80"><path fill="url(#fg)" d="M32 4C34 22 52 30 52 52a20 20 0 0 1-40 0c0-12 6-18 12-26 1 8 4 11 7 12-3-14 0-26 1-34z"/><path fill="#fff4c2" opacity=".85" d="M32 40c6 7 10 12 10 18a10 10 0 0 1-20 0c0-6 4-11 10-18z"/></svg>
  <b>Drill</b>
</button>

<!-- floating in-test controls -->
<div id="tdock" aria-label="Test controls">
  <button id="tPause" data-act="pause" aria-label="Pause"><span>⏸</span><em>Pause</em></button>
  <button data-act="grid" aria-label="Question list"><span>▦</span><em>List</em></button>
  <button id="tPad" data-act="tools" data-v="pad" aria-label="Rough pad"><span>✏️</span><em>Pad</em></button>
  <button id="tCalc" data-act="tools" data-v="calc" aria-label="Calculator"><span>🧮</span><em>Calc</em></button>
  <button data-act="trick" aria-label="Memory trick"><span>🧠</span><em>Trick</em></button>
  <button class="x" data-act="exit" aria-label="Exit test"><span>✕</span><em>Exit</em></button>
</div>

<!-- question palette drawer -->
<div class="shade" id="shade" data-act="closegrid"></div>
<div id="drawer"></div>

<!-- rough pad + calculator -->
<div id="tools" aria-label="Rough work pad and calculator">
  <div class="thead">
    <div class="row"><button class="chip on" id="tabPad" data-act="ttab" data-v="pad">✏️ Rough pad</button><button class="chip" id="tabCalc" data-act="ttab" data-v="calc">🧮 Calculator</button></div>
    <button class="btn g s" data-act="toolsclose">✕ Close</button>
  </div>
  <div id="padWrap">
    <div class="ptools">
      <button class="dot on" data-pc="auto" data-act="padcol" data-v="auto" style="background:var(--tx)" aria-label="Default ink"></button>
      <button class="dot" data-pc="#ef4444" data-act="padcol" data-v="#ef4444" style="background:#ef4444" aria-label="Red"></button>
      <button class="dot" data-pc="#3b82f6" data-act="padcol" data-v="#3b82f6" style="background:#3b82f6" aria-label="Blue"></button>
      <button class="dot" data-pc="#10b981" data-act="padcol" data-v="#10b981" style="background:#10b981" aria-label="Green"></button>
      <button class="chip" id="bErase" data-act="paderase">🧽 Eraser</button>
      <button class="chip" data-act="padundo">↩ Undo</button>
      <button class="chip" data-act="padclear">Clear</button>
    </div>
    <canvas id="pad"></canvas>
  </div>
  <div id="calcWrap" style="display:none">
    <div class="cdisp"><small id="cexp"></small><b id="cval">0</b></div>
    <div class="ckeys" id="ckeys"></div>
  </div>
</div>

<input type="file" id="imp" accept=".json,application/json" style="display:none">

<!-- overlays -->
<div class="ov" id="pause"><div class="ovc">
  <div class="big">⏸</div><h2>Test paused</h2>
  <p class="mu" style="margin:6px 0 16px">The timer is stopped · <b id="pLeft"></b> left.<br>Questions are hidden while paused.</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="unpause">▶ Resume</button><button class="btn g" data-act="pauseexit">Save &amp; exit</button></div>
</div></div>

<div class="ov dim" id="warn"><div class="ovc">
  <div class="big">⚠️</div><h2>You left full-screen</h2>
  <p class="mu" style="margin:6px 0 16px">In the real exam this would be flagged. Your timer is still running.</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="fsback">Return to full-screen</button><button class="btn g" data-act="fsskip">Continue</button></div>
</div></div>

<div class="ov dim" id="noteM"><div class="ovc" style="text-align:left">
  <div class="big" style="font-size:2rem">🧠</div>
  <h2>Memory trick</h2>
  <p class="mu" id="nq" style="margin:4px 0 12px;max-height:4.6em;overflow:hidden"></p>
  <input id="ni" class="tin" maxlength="120" placeholder="One line you'll remember… e.g. “KAlinga = KAruna”" autocomplete="off">
  <p class="mu" style="margin:6px 0 14px;font-size:.78rem">It shows up again whenever this question comes back in revision.</p>
  <div class="row"><button class="btn" data-act="notesave">Save trick</button><button class="btn g" data-act="notedel">Remove</button><button class="btn g" data-act="noteclose">Cancel</button></div>
</div></div>

<div class="ov dim" id="tour"></div>
<canvas id="cf"></canvas><div id="toast"></div>

<!-- printable one-page report (Save as PDF) -->
<div id="rwrap">
  <div class="rtool">
    <b>📄 Report preview</b>
    <span class="row">
      <button class="btn s" data-act="reportprint">⬇ Save as PDF / Print</button>
      <button class="btn g s" data-act="reportshare">📤 Share summary</button>
      <button class="btn g s" data-act="reportclose">✕ Close</button>
    </span>
  </div>
  <div class="rscroll"><div id="rbody"></div></div>
</div>

<script src="data/manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
